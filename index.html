<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vòng Quay May Mắn - Pro</title>
    <!-- Nhúng phông chữ Be Vietnam Pro từ Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Be Vietnam Pro', sans-serif;
        }

        :root {
            --bg-dark: #081120;
            --bg-mid: #111827;
            --panel: rgba(15, 23, 42, 0.72);
            --panel-light: rgba(30, 41, 59, 0.9);
            --line: rgba(148, 163, 184, 0.22);
            --text: #e2e8f0;
            --muted: #94a3b8;
            --primary: #8b5cf6;
            --secondary: #38bdf8;
            --warm: #f97316;
            --pink: #ec4899;
            --success: #34d399;
            --shadow: 0 25px 60px rgba(2, 6, 23, 0.6);
        }

        body {
            background:
                radial-gradient(circle at top left, rgba(139, 92, 246, 0.28), transparent 25%),
                radial-gradient(circle at bottom right, rgba(56, 189, 248, 0.22), transparent 30%),
                linear-gradient(135deg, var(--bg-dark) 0%, var(--bg-mid) 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 28px;
            color: var(--text);
        }

        .main-container {
            width: min(1100px, 100%);
            display: grid;
            grid-template-columns: 330px minmax(320px, 1fr);
            gap: 32px;
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid var(--line);
            border-radius: 30px;
            backdrop-filter: blur(16px);
            box-shadow: var(--shadow);
            padding: 28px;
            position: relative;
            overflow: hidden;
        }

        .main-container::before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(139, 92, 246, 0.12), rgba(56, 189, 248, 0.08), transparent 60%);
            pointer-events: none;
        }

        .controls,
        .wheel-wrapper {
            position: relative;
            z-index: 1;
        }

        .info-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 12px;
        }

        .chip {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 7px 12px;
            border-radius: 999px;
            background: rgba(56, 189, 248, 0.12);
            color: var(--secondary);
            border: 1px solid rgba(56, 189, 248, 0.25);
            font-size: 11px;
            letter-spacing: 1px;
            text-transform: uppercase;
            font-weight: 700;
        }

        .controls {
            display: flex;
            flex-direction: column;
            background: rgba(15, 23, 42, 0.75);
            border: 1px solid var(--line);
            border-radius: 22px;
            padding: 22px 18px;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.05);
        }

        .controls h2 {
            font-size: 1.15rem;
            margin-bottom: 8px;
            color: var(--text);
            letter-spacing: 0.04em;
        }

        .controls p {
            color: var(--muted);
            font-size: 0.86rem;
            margin-bottom: 16px;
            line-height: 1.6;
        }

        .controls label {
            font-weight: 700;
            font-size: 0.8rem;
            color: #c4b5fd;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        textarea {
            width: 100%;
            min-height: 220px;
            padding: 16px 14px;
            font-size: 0.96rem;
            border-radius: 16px;
            border: 1px solid rgba(148, 163, 184, 0.2);
            background: linear-gradient(180deg, rgba(15, 23, 42, 0.95), rgba(15, 23, 42, 0.8));
            color: var(--text);
            outline: none;
            resize: vertical;
            transition: border-color 0.25s ease, box-shadow 0.25s ease, transform 0.2s ease;
            box-shadow: inset 0 1px 8px rgba(15, 23, 42, 0.7);
        }

        textarea:focus {
            border-color: rgba(56, 189, 248, 0.8);
            box-shadow: 0 0 0 4px rgba(56, 189, 248, 0.12);
        }

        button {
            margin-top: 18px;
            padding: 15px 18px;
            background: linear-gradient(135deg, #f472b6 0%, #8b5cf6 40%, #38bdf8 100%);
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 1rem;
            font-weight: 800;
            letter-spacing: 0.06em;
            cursor: pointer;
            box-shadow: 0 15px 30px rgba(139, 92, 246, 0.35);
            transition: transform 0.2s ease, box-shadow 0.2s ease, filter 0.2s ease;
            text-transform: uppercase;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 20px 35px rgba(139, 92, 246, 0.42);
            filter: brightness(1.04);
        }

        button:active {
            transform: translateY(0);
        }

        .wheel-wrapper {
            background: linear-gradient(180deg, rgba(15, 23, 42, 0.7), rgba(17, 24, 39, 0.9));
            border: 1px solid var(--line);
            border-radius: 28px;
            min-height: 520px;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
            position: relative;
        }

        .wheel-shell {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .wheel-glow {
            position: absolute;
            width: 440px;
            height: 440px;
            background: radial-gradient(circle, rgba(56, 189, 248, 0.16), rgba(139, 92, 246, 0.02) 50%, transparent 70%);
            border-radius: 50%;
        }

        canvas {
            width: min(420px, 76vw);
            height: min(420px, 76vw);
            filter: drop-shadow(0 20px 30px rgba(0,0,0,0.5));
            position: relative;
            z-index: 1;
        }

        .center-cap {
            position: absolute;
            width: 66px;
            height: 66px;
            background: radial-gradient(circle at 30% 30%, #ffffff 0%, #dbeafe 30%, #cbd5e1 100%);
            border-radius: 50%;
            box-shadow: 0 12px 22px rgba(15, 23, 42, 0.45), inset 0 3px 10px rgba(255,255,255,0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 28px;
            z-index: 2;
            pointer-events: none;
            border: 3px solid rgba(255,255,255,0.7);
            overflow: hidden;
        }

        .center-cap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .pointer {
            position: absolute;
            right: -18px;
            top: 50%;
            transform: translateY(-50%);
            width: 0;
            height: 0;
            border-top: 18px solid transparent;
            border-bottom: 18px solid transparent;
            border-right: 38px solid #f43f5e;
            filter: drop-shadow(-2px 2px 5px rgba(0,0,0,0.45));
            z-index: 10;
        }

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(2, 6, 23, 0.72);
            backdrop-filter: blur(8px);
            justify-content: center;
            align-items: center;
            z-index: 100;
            padding: 20px;
        }

        .modal-content {
            background: linear-gradient(180deg, rgba(15, 23, 42, 0.96), rgba(30, 41, 59, 0.96));
            padding: 28px 32px;
            border-radius: 20px;
            border: 1px solid rgba(56, 189, 248, 0.35);
            text-align: center;
            box-shadow: 0 20px 50px rgba(56, 189, 248, 0.2);
            animation: popIn 0.3s ease-out;
            max-width: 420px;
            width: 100%;
        }

        .modal-content h2 {
            color: #7dd3fc;
            margin-bottom: 10px;
            font-size: clamp(1.2rem, 2vw, 1.8rem);
        }

        .modal-content h1 {
            color: #f472b6;
            font-size: clamp(2rem, 4vw, 3rem);
            margin-bottom: 18px;
        }

        .modal-content button {
            margin-top: 0;
            padding: 12px 24px;
            font-size: 0.9rem;
        }

        .fireworks-layer {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 200;
            overflow: hidden;
        }

        #fireworksCanvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        @keyframes popIn {
            0% { transform: scale(0.7); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        @media (max-width: 860px) {
            .main-container {
                grid-template-columns: 1fr;
                padding: 20px;
                gap: 20px;
            }

            .wheel-wrapper {
                min-height: 440px;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 18px;
            }

            .controls {
                padding: 18px 14px;
            }

            textarea {
                min-height: 180px;
            }
        }
    </style>
</head>
<body>

    <div class="main-container">
        <div class="controls">
            <div class="info-bar">
                <span class="chip">Lucky spin</span>
            </div>
            <h2>Chọn danh sách</h2>
            <p>Nhập tên người chơi hoặc chủ đề để bắt đầu vòng quay may mắn.</p>
            <label for="names">Danh sách tên</label>
            <textarea id="names">
James
David
Alice
</textarea>
            <button id="spinBtn">Quay ngay</button>
        </div>

        <div class="wheel-wrapper">
            <div class="wheel-shell">
                <div class="wheel-glow"></div>
                <canvas id="wheel" width="420" height="420"></canvas>
                <div class="center-cap">
                    <img src="https://i.pinimg.com/736x/87/e8/de/87e8de30e385ada93e2e7d1d9368b666.jpg" alt="Ảnh giữa vòng quay">
                </div>
                <div class="pointer"></div>
            </div>
        </div>
    </div>

    <div class="fireworks-layer">
        <canvas id="fireworksCanvas"></canvas>
    </div>

    <!-- Hộp thoại chúc mừng chiến thắng -->
    <div class="modal" id="winnerModal">
        <div class="modal-content">
            <h2>🎉 XIN CHÚC MỪNG 🎉</h2>
            <h1 id="winnerName">Tên Người Thắng</h1>
            <button onclick="closeModal()">Đóng</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('wheel');
        const ctx = canvas.getContext('2d');
        const namesInput = document.getElementById('names');
        const spinBtn = document.getElementById('spinBtn');
        const winnerModal = document.getElementById('winnerModal');
        const winnerName = document.getElementById('winnerName');
        const fireworkCanvas = document.getElementById('fireworksCanvas');
        const fireworkCtx = fireworkCanvas.getContext('2d');

        let names = [];
        let currentAngle = 0; 
        let spinVelocity = 0; 
        let animationId;
        let lastSegment = 0; 
        let audioCtx = null;
        let fireworks = [];
        let fireworkLoopId = null;

        const centerX = canvas.width / 2;
        const centerY = canvas.height / 2;
        const radius = 190;

        // Bảng màu Pastel rực rỡ
        const colors = [
            '#ff4757', '#2ed573', '#1e90ff', '#ffa502', 
            '#9b59b6', '#e84393', '#00d2d3', '#54a0ff'
        ];

        function playClickSound() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            osc.type = 'triangle';
            osc.frequency.setValueAtTime(600, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.02);

            gain.gain.setValueAtTime(0.8, audioCtx.currentTime); // Âm lượng 80%
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.02);

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start();
            osc.stop(audioCtx.currentTime + 0.02);
        }

        function drawWheel() {
            names = namesInput.value.split('\n').map(n => n.trim()).filter(n => n !== '');
            if (names.length === 0) return;

            ctx.clearRect(0, 0, canvas.width, canvas.height); 
            const arcSize = (2 * Math.PI) / names.length; 

            for (let i = 0; i < names.length; i++) {
                const angle = currentAngle + i * arcSize;
                
                // Vẽ ô màu
                ctx.beginPath();
                ctx.moveTo(centerX, centerY);
                ctx.arc(centerX, centerY, radius, angle, angle + arcSize);
                ctx.fillStyle = colors[i % colors.length];
                ctx.fill();
                
                // Viền trắng mảnh giữa các ô
                ctx.lineWidth = 2;
                ctx.strokeStyle = '#ffffff';
                ctx.stroke();

                // Vẽ tên chữ trắng đậm
                ctx.save();
                ctx.translate(centerX, centerY);
                ctx.rotate(angle + arcSize / 2);
                ctx.textAlign = "right";
                ctx.fillStyle = "white";
                ctx.font = "bold 15px 'Be Vietnam Pro', sans-serif";
                ctx.shadowColor = "rgba(0,0,0,0.5)";
                ctx.shadowBlur = 4;
                ctx.fillText(names[i], radius - 15, 5);
                ctx.restore();
            }
        }

        function animate() {
            if (spinVelocity > 0) {
                currentAngle += spinVelocity; 
                spinVelocity *= 0.985; 

                const arcSize = (2 * Math.PI) / names.length;
                const currentSegment = Math.floor(currentAngle / arcSize);

                if (currentSegment !== lastSegment) {
                    playClickSound(); 
                    lastSegment = currentSegment; 
                }

                if (spinVelocity < 0.002) {
                    spinVelocity = 0; 
                    cancelAnimationFrame(animationId);
                    showWinner();
                } else {
                    drawWheel();
                    animationId = requestAnimationFrame(animate);
                }
            }
        }

        function launchFireworks(x, y) {
            const colors = ['#ff4757', '#ffd93d', '#38bdf8', '#a78bfa', '#34d399', '#fb7185'];
            const particleCount = 70;

            for (let i = 0; i < particleCount; i++) {
                const angle = (Math.PI * 2 * i) / particleCount;
                const speed = 2 + Math.random() * 3.5;
                fireworks.push({
                    x,
                    y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    radius: 2 + Math.random() * 2.5,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    life: 55 + Math.random() * 30,
                    maxLife: 55 + Math.random() * 30,
                    gravity: 0.08
                });
            }

            if (!fireworkLoopId) {
                fireworkLoopId = requestAnimationFrame(drawFireworks);
            }
        }

        function drawFireworks() {
            fireworkCtx.clearRect(0, 0, fireworkCanvas.width, fireworkCanvas.height);
            let alive = 0;

            for (const particle of fireworks) {
                particle.x += particle.vx;
                particle.y += particle.vy;
                particle.vy += particle.gravity;
                particle.life -= 1;

                if (particle.life > 0) {
                    alive += 1;
                    fireworkCtx.beginPath();
                    fireworkCtx.arc(particle.x, particle.y, particle.radius, 0, Math.PI * 2);
                    fireworkCtx.fillStyle = particle.color;
                    fireworkCtx.globalAlpha = Math.max(0, particle.life / particle.maxLife);
                    fireworkCtx.fill();
                    fireworkCtx.globalAlpha = 1;
                }
            }

            fireworks = fireworks.filter(p => p.life > 0);

            if (alive > 0) {
                fireworkLoopId = requestAnimationFrame(drawFireworks);
            } else {
                fireworkLoopId = null;
                fireworkCtx.clearRect(0, 0, fireworkCanvas.width, fireworkCanvas.height);
            }
        }

        function resizeFireworksCanvas() {
            fireworkCanvas.width = window.innerWidth;
            fireworkCanvas.height = window.innerHeight;
        }

        function showWinner() {
            const arcSize = (2 * Math.PI) / names.length;
            const degrees = currentAngle % (2 * Math.PI); 
            const index = Math.floor((2 * Math.PI - degrees) / arcSize) % names.length;
            
            winnerName.innerText = names[index];
            winnerModal.style.display = 'flex';

            const centerX = window.innerWidth / 2;
            const centerY = window.innerHeight / 2 - 40;
            for (let i = 0; i < 4; i++) {
                setTimeout(() => {
                    launchFireworks(
                        centerX + (Math.random() - 0.5) * 240,
                        centerY + (Math.random() - 0.5) * 160
                    );
                }, i * 200);
            }
        }

        function closeModal() {
            winnerModal.style.display = 'none';
        }

        namesInput.addEventListener('input', drawWheel);
        window.addEventListener('resize', resizeFireworksCanvas);
        resizeFireworksCanvas();
        
        spinBtn.addEventListener('click', () => {
            if (spinVelocity > 0 || names.length === 0) return; 
            
            const arcSize = (2 * Math.PI) / names.length;
            lastSegment = Math.floor(currentAngle / arcSize);

            spinVelocity = Math.random() * 0.25 + 0.35; 
            animate();
        });

        drawWheel();
    </script>

</body>
</html>
